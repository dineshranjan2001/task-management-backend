name: task-management-backend

services:
  # --- Database Service ---
  db:
    image: postgres:17-alpine
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-tms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tms1234}
      POSTGRES_DB: ${DB_NAME:-tms}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - tms_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tms} -d ${DB_NAME:-tms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Redis Service ---
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - tms_redis_data:/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

# --- Persistent Storage Volumes ---
volumes:
  tms_data:
    driver: local
  tms_redis_data:
    driver: local

# --- Isolated Network Overlay ---
networks:
  app_network:
    driver: bridge
